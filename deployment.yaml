apiVersion: apps/v1
kind: Deployment

metadata:
  name: capstone-website

spec:
  replicas: 2

  selector:
    matchLabels:
      app: capstone-website

  template:
    metadata:
      labels:
        app: capstone-website

    spec:
      containers:
        - name: capstone-website

          image: sufiyannadeem/capstone-website:latest

          ports:
            - containerPort: 80

          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"

            limits:
              cpu: "500m"
              memory: "256Mi"

---

apiVersion: v1
kind: Service

metadata:
  name: capstone-website-service

spec:
  type: NodePort

  selector:
    app: capstone-website

  ports:
    - port: 80
      targetPort: 80
      nodePort: 30008
